# git-cliff configuration — https://git-cliff.org/docs/configuration
# CHANGELOG.md is generated by `make changelog`. Never edit it by hand.

[changelog]
header = """
# Changelog

All notable changes to this project. Generated from conventional commits by git-cliff.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | upper_first | trim }} \
([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true
# Commit links are built offline; no GitHub API calls.
postprocessors = [
  { pattern = '<REPO>', replace = "https://github.com/aqasim81/ai-code-review-bot" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  # Phase bookkeeping commits carry no user-facing change.
  { message = "^chore: complete phase", skip = true },
  { message = "^chore: mark phase", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^ci", group = "<!-- 6 -->CI" },
  { message = "^chore", group = "<!-- 7 -->Chores" },
]

[bump]
# First release when no tags exist yet (used by git cliff --bump / --bumped-version).
initial_tag = "v0.1.0"
